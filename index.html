  <script>
    // Se ejecuta antes del primer pintado para evitar el parpadeo de tema (FOUC).
    (function () {
      // Oscuro por defecto, sin importar el sistema; claro solo si el usuario lo eligió.
      // si el navegador bloquea localStorage, leerlo lanza un error: se ignora y queda el tema oscuro
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch {}
    })();
  </script>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body class="min-h-screen bg-app-bg text-app-text font-sans flex flex-col items-center justify-center px-4 py-12 gap-8">

      </ul>
    </div>

    <button
      type="button"
      id="theme-toggle"
      aria-label="Toggle theme"
      data-i18n-aria-label="theme.toggle"
      class="p-2 rounded-lg text-app-muted hover:text-app-accent hover:bg-app-panel transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-app-accent focus-visible:text-app-accent"

  <div class="text-center">
    <h1 data-i18n="app.title" class="text-2xl font-semibold tracking-tight">Secure Password Generator</h1>
    <p data-i18n="app.subtitle" class="text-sm text-app-muted mt-1">Your digital security starts with a strong password</p>
  </div>

  <section class="w-full max-w-md bg-app-panel border border-app-border rounded-2xl p-6 shadow-app">

    <div class="flex items-center justify-between gap-3 bg-app-bg border border-app-border rounded-xl px-4 py-4 mb-6">
      <p id="resulting-password" class="font-mono text-lg text-app-accent tracking-wide break-all">password example</p>
      <div id="icons" class="flex items-center gap-2 shrink-0">
        <div class="relative">
          <button
            type="button"
            id="copy-btn"
            aria-label="Copy password"
            data-i18n-aria-label="actions.copy"
            class="p-1.5 rounded-lg text-app-muted hover:text-app-accent hover:bg-app-bg transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-app-accent focus-visible:text-app-accent"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-5 h-5" fill="currentColor"><path d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z"/></svg>
          </button>
          <span
            id="copy-tooltip"
            aria-hidden="true"
            class="absolute top-full mt-2 left-1/2 -translate-x-1/2 whitespace-nowrap text-xs bg-app-border text-app-text px-2 py-1 rounded-md opacity-0 pointer-events-none transition-opacity duration-200"
          ></span>
        </div>
        <button
          type="button"
          id="refresh-btn"
          aria-label="Generate new password"
          data-i18n-aria-label="actions.refresh"
          class="p-1.5 rounded-lg text-app-muted hover:text-app-accent hover:bg-app-bg transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-app-accent focus-visible:text-app-accent"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-5 h-5" fill="currentColor"><path d="M204-318q-22-38-33-78t-11-82q0-134 93-228t227-94h7l-64-64 56-56 160 160-160 160-56-56 64-64h-7q-100 0-170 70.5T240-478q0 26 6 51t18 49l-60 60ZM481-40 321-200l160-160 56 56-64 64h7q100 0 170-70.5T720-482q0-26-6-51t-18-49l60-60q22 38 33 78t11 82q0 134-93 228t-227 94h-7l64 64-56 56Z"/></svg>
        </button>
      </div>
    </div>

    <div class="mb-6">
      <div class="flex items-center justify-between mb-2">
        <label for="check-length" data-i18n="options.length" class="text-sm text-app-muted">Length</label>
        <span id="length-value" class="text-sm font-mono text-app-accent">12</span>
      </div>
      <input
        type="range"
        name="length"
        id="check-length"
        min="8"
        max="50"
        value="12"
        class="w-full h-1.5 rounded-full bg-app-border accent-app-accent cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-app-accent"
      >
    </div>

    <div class="grid grid-cols-2 gap-2">
      <label for="check-uppercase" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm cursor-pointer hover:bg-app-bg transition-colors has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-app-accent has-[:focus-visible]:bg-app-bg">
        <input type="checkbox" name="uppercase" id="check-uppercase" checked class="accent-app-accent focus-visible:outline-none">
        <span data-i18n="options.uppercase">Uppercase</span>
      </label>
      <label for="check-lowercase" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm cursor-pointer hover:bg-app-bg transition-colors has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-app-accent has-[:focus-visible]:bg-app-bg">
        <input type="checkbox" name="lowercase" id="check-lowercase" checked class="accent-app-accent focus-visible:outline-none">
        <span data-i18n="options.lowercase">Lowercase</span>
      </label>
      <label for="check-numbers" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm cursor-pointer hover:bg-app-bg transition-colors has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-app-accent has-[:focus-visible]:bg-app-bg">
        <input type="checkbox" name="numbers" id="check-numbers" checked class="accent-app-accent focus-visible:outline-none">
        <span data-i18n="options.numbers">Numbers</span>
      </label>
      <label for="check-symbols" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm cursor-pointer hover:bg-app-bg transition-colors has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-app-accent has-[:focus-visible]:bg-app-bg">
        <input type="checkbox" name="symbols" id="check-symbols" checked class="accent-app-accent focus-visible:outline-none">
        <span data-i18n="options.symbols">Symbols</span>
      </label>
    </div>

  </section>

  <!-- región única de anuncios para lectores de pantalla (copiar y errores);
       la llena announce() en index.js -->
  <p id="live-region" role="status" class="sr-only"></p>

  <script type="module" src="./src/index.js"></script>
</body>
</html>
