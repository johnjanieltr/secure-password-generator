<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <title>Secure Password Generator - By johnjanieltr</title>
</head>
<body>
  <h1>Secure Password Generator</h1>
  <section>
    <div>
      <p id="resulting-password">password example</p>
      <div id="icons">
      </div>
    </div>
    <div>
      <span>
        Length
        <input type="number" name="length" id="check-length" value="10">
      </span>
      <span>
        Uppercase
        <input type="checkbox" name="uppercase" id="check-uppercase">
      </span>
      <span>
        Lowercase
        <input type="checkbox" name="lowercase" id="check-lowercase">
      </span>
      <span>

      </span>
      <input type="checkbox" name="numbers" id="check-numbers">
      <input type="checkbox" name="symbols" id="check-symbols">
    </div>
  </section>
  <!-- longitud, incluir: Mayusculas (A-Z) Minusculas (a-z), Numbers (0-9) Symbols (!@#$%^&*) -->
  <!-- incluir boton de generar nueva contraseña y otro de copiar al portapapeles-->
   <script type="module" src="./index.js"></script>
</body>
</html>
