<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Se ejecuta ANTES de que el navegador pinte la página, para evitar el
    // parpadeo de "flash de tema incorrecto" (FOUC).
    (function () {
      // Por defecto siempre es dark, sin importar el sistema operativo del
      // usuario. Solo cambiamos a light si el usuario ya lo eligió antes.
      const storedTheme = localStorage.getItem("theme");

      if (storedTheme === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="stylesheet" href="./src/styles.css">
  <title>Secure Password Generator - By johnjanieltr</title>
</head>
<body class="min-h-screen bg-app-bg text-app-text font-sans flex flex-col items-center justify-center px-4 py-12 gap-8">

  <button
    type="button"
    id="theme-toggle"
    aria-label="Toggle theme"
    class="fixed top-4 right-4 p-2 rounded-lg text-app-muted hover:text-app-accent hover:bg-app-panel transition-colors"
  >
    <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-5 h-5 hidden" fill="currentColor"><path d="M480-360q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Zm0 80q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-101 57-57 101 100-57 58Zm492 496-101-101 57-57 100 101-56 57ZM650-704l101-101 57 57-101 101-57-57ZM154-201l101-101 57 57-100 101-58-57Z"/></svg>
    <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-5 h-5" fill="currentColor"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/></svg>
  </button>

  <div class="text-center">
    <h1 class="text-2xl font-semibold tracking-tight">Secure Password Generator</h1>
    <p class="text-sm text-app-muted mt-1">Generated locally in your browser. Nothing leaves your device.</p>
  </div>

  <section class="w-full max-w-md bg-app-panel border border-app-border rounded-2xl p-6 shadow-app">

    <div class="flex items-center justify-between gap-3 bg-app-bg border border-app-border rounded-xl px-4 py-4 mb-6">
      <p id="resulting-password" class="font-mono text-lg text-app-accent tracking-wide break-all">password example</p>
      <div id="icons" class="flex items-center gap-2 shrink-0">
        <div class="relative">
          <button
            type="button"
            id="copy-btn"
            aria-label="Copy password"
            class="p-1.5 rounded-lg text-app-muted hover:text-app-accent hover:bg-app-bg transition-colors"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-5 h-5" fill="currentColor"><path d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z"/></svg>
          </button>
          <span
            id="copy-tooltip"
            role="status"
            class="absolute top-full mt-2 left-1/2 -translate-x-1/2 whitespace-nowrap text-xs bg-app-border text-app-text px-2 py-1 rounded-md opacity-0 pointer-events-none transition-opacity duration-200"
          >
            Copied to clipboard
          </span>
        </div>
        <button
          type="button"
          id="refresh-btn"
          aria-label="Generate new password"
          class="p-1.5 rounded-lg text-app-muted hover:text-app-accent hover:bg-app-bg transition-colors"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-5 h-5" fill="currentColor"><path d="M204-318q-22-38-33-78t-11-82q0-134 93-228t227-94h7l-64-64 56-56 160 160-160 160-56-56 64-64h-7q-100 0-170 70.5T240-478q0 26 6 51t18 49l-60 60ZM481-40 321-200l160-160 56 56-64 64h7q100 0 170-70.5T720-482q0-26-6-51t-18-49l60-60q22 38 33 78t11 82q0 134-93 228t-227 94h-7l64 64-56 56Z"/></svg>
        </button>
      </div>
    </div>

    <div class="mb-6">
      <div class="flex items-center justify-between mb-2">
        <label for="check-length" class="text-sm text-app-muted">Length</label>
        <span id="length-value" class="text-sm font-mono text-app-accent">12</span>
      </div>
      <input
        type="range"
        name="length"
        id="check-length"
        min="8"
        max="50"
        value="12"
        class="w-full h-1.5 rounded-full bg-app-border accent-app-accent cursor-pointer"
      >
    </div>

    <div class="grid grid-cols-2 gap-2">
      <label for="check-uppercase" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm cursor-pointer hover:bg-app-bg transition-colors">
        <input type="checkbox" name="uppercase" id="check-uppercase" checked class="accent-app-accent">
        Uppercase
      </label>
      <label for="check-lowercase" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm cursor-pointer hover:bg-app-bg transition-colors">
        <input type="checkbox" name="lowercase" id="check-lowercase" checked class="accent-app-accent">
        Lowercase
      </label>
      <label for="check-numbers" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm cursor-pointer hover:bg-app-bg transition-colors">
        <input type="checkbox" name="numbers" id="check-numbers" checked class="accent-app-accent">
        Numbers
      </label>
      <label for="check-symbols" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm cursor-pointer hover:bg-app-bg transition-colors">
        <input type="checkbox" name="symbols" id="check-symbols" checked class="accent-app-accent">
        Symbols
      </label>
    </div>

  </section>

  <script type="module" src="./src/index.js"></script>
</body>
</html>
